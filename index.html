<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    id="viewportMeta"
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />

  <script>
    (() => {
      const mode =
        localStorage.getItem("accavoidViewMode");

      if (mode === "desktop") {
        document
          .getElementById("viewportMeta")
          .setAttribute(
            "content",
            "width=1200, initial-scale=1.0, viewport-fit=cover"
          );

        document.documentElement.classList.add(
          "force-desktop-view"
        );
      }
    })();
  </script>
  <title>accavoid lyuhwa</title>
  <link
    rel="icon"
    type="image/png"
    href="images/mark.png"
  />
  <link
    rel="apple-touch-icon"
    href="images/mark.png"
  />

  <link rel="stylesheet" href="styles.css" />

  <style>
    .checkbox-field {
      margin-top: 4px;
    }

    .thief-toggle {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      width: max-content;
      max-width: 100%;
      color: var(--text);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    .thief-toggle-input {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      border: 0;
      white-space: nowrap;
    }

    .thief-toggle-switch {
      position: relative;
      flex: 0 0 auto;
      width: 46px;
      height: 26px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.2);
      transition: background 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }

    .thief-toggle-switch::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      transition: transform 160ms ease;
    }

    .thief-toggle-input:checked + .thief-toggle-switch {
      border-color: var(--accent);
      background: var(--accent);
      box-shadow: 0 0 0 3px rgba(85, 157, 255, 0.14);
    }

    .thief-toggle-input:checked + .thief-toggle-switch::after {
      transform: translateX(20px);
    }

    .thief-toggle-input:focus-visible + .thief-toggle-switch {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .thief-toggle-text {
      min-width: max-content;
      font-size: 0.92rem;
      line-height: 1.2;
      color: var(--text);
    }

    .user-number-control {
      display: grid;
      grid-template-columns: minmax(86px, 116px) minmax(0, 1fr);
      align-items: center;
      gap: 14px;
    }

    .user-number-input {
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .field input.user-range {
      width: 100%;
      height: 24px;
      padding: 0;
      border: 0;
      border-radius: 0;
      outline: none;
      background: transparent;
      box-shadow: none;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .field input.user-range:focus {
      border: 0;
      box-shadow: none;
    }

    .user-range::-webkit-slider-runnable-track {
      height: 6px;
      border-radius: 999px;
      background: rgba(122, 184, 255, 0.24);
    }

    .user-range::-webkit-slider-thumb {
      width: 18px;
      height: 18px;
      margin-top: -6px;
      border: 2px solid var(--panel);
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      -webkit-appearance: none;
      appearance: none;
    }

    .user-range::-moz-range-track {
      height: 6px;
      border: 0;
      border-radius: 999px;
      background: rgba(122, 184, 255, 0.24);
    }

    .user-range::-moz-range-progress {
      height: 6px;
      border-radius: 999px;
      background: var(--accent);
    }

    .user-range::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border: 2px solid var(--panel);
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }

    @media (max-width: 520px) {
      .user-number-control {
        grid-template-columns: 82px minmax(0, 1fr);
        gap: 10px;
      }
    }

  </style>
</head>

<body>
  <main class="page">
    <header class="hero">
      <div class="brand-mark-wrap" aria-label="accavoid">
        <img
          class="brand-mark"
          src="images/mark.png"
          alt=""
        />
      </div>

      <h1></h1>

      <button id="resetButton" class="top-reset-button" type="button">
        입력 초기화
      </button>
    </header>

    <div class="desktop-workspace">
      <aside id="inputPanel" class="user-sidebar">
        <article class="card user-card">
        <h2>나의 정보</h2>

        <div class="fields">
          <div class="field user-slider-field">
            <label for="userLevel">나의 레벨</label>
            <div class="user-number-control">
              <input
                id="userLevel"
                class="user-number-input"
                type="text"
                inputmode="numeric"
                autocomplete="off"
                placeholder="ex) 180"
                data-min="1"
                data-max="200"
              />
              <input
                id="userLevelRange"
                class="user-range"
                type="range"
                min="1"
                max="200"
                value="180"
                disabled
                aria-label="나의 레벨 슬라이더"
              />
            </div>
          </div>

          <div class="field user-slider-field">
            <label for="userAcc">나의 명중률</label>
            <div class="user-number-control">
              <input
                id="userAcc"
                class="user-number-input"
                type="text"
                inputmode="numeric"
                autocomplete="off"
                placeholder="ex) 180"
                data-min="1"
                data-max="1000"
              />
              <input
                id="userAccRange"
                class="user-range"
                type="range"
                min="1"
                max="500"
                value="180"
                disabled
                aria-label="나의 명중률 슬라이더"
              />
            </div>
          </div>

          <div class="field user-slider-field">
            <label for="userAvoid">나의 회피율</label>
            <div class="user-number-control">
              <input
                id="userAvoid"
                class="user-number-input"
                type="text"
                inputmode="numeric"
                autocomplete="off"
                placeholder="ex) 100"
                data-min="1"
                data-max="1000"
              />
              <input
                id="userAvoidRange"
                class="user-range"
                type="range"
                min="1"
                max="1000"
                value="100"
                disabled
                aria-label="나의 회피율 슬라이더"
              />
            </div>
          </div>

          <div class="field checkbox-field">
            <label class="thief-toggle" for="isThiefJob">
              <input
                id="isThiefJob"
                class="thief-toggle-input"
                type="checkbox"
              />
              <span class="thief-toggle-switch" aria-hidden="true"></span>
              <span class="thief-toggle-text">도적 직업군</span>
            </label>
          </div>
        </div>
        </article>

        <div class="sticky-panel-divider" aria-hidden="true"></div>

        <article class="card monster-input-card">
          <h2>몬스터 정보</h2>

        <div class="fields">
          <div class="field preset-field">
            <label for="monsterPresetSearch">몬스터 이름 검색</label>
            <div class="preset-search-wrap">
              <input
                id="monsterPresetSearch"
                class="preset-search"
                type="text"
                autocomplete="off"
                placeholder="몬스터 이름 검색"
                aria-autocomplete="list"
                aria-controls="monsterAutocomplete"
                aria-expanded="false"
              />
              <button
                id="monsterPresetClear"
                class="preset-clear hidden"
                type="button"
                aria-label="선택한 몬스터 지우기"
                title="선택한 몬스터 지우기"
              >×</button>
            </div>
            <div
              id="monsterAutocomplete"
              class="autocomplete-list hidden"
              role="listbox"
            ></div>
            <div id="monsterPresetSelected" class="preset-selected hidden"></div>
          </div>

          <div class="field user-slider-field">
            <label for="mobLevel">몬스터 레벨</label>
            <div class="user-number-control">
              <input
                id="mobLevel"
                class="user-number-input"
                type="text"
                inputmode="numeric"
                autocomplete="off"
                placeholder="ex) 180"
                data-min="1"
                data-max="200"
              />
              <input
                id="mobLevelRange"
                class="user-range"
                type="range"
                min="1"
                max="200"
                value="180"
                disabled
                aria-label="몬스터 레벨 슬라이더"
              />
            </div>
          </div>

          <div class="field user-slider-field">
            <label for="mobAcc">몬스터 명중률</label>
            <div class="user-number-control">
              <input
                id="mobAcc"
                class="user-number-input"
                type="text"
                inputmode="numeric"
                autocomplete="off"
                placeholder="ex) 270"
                data-min="1"
                data-max="1000"
              />
              <input
                id="mobAccRange"
                class="user-range"
                type="range"
                min="1"
                max="500"
                value="270"
                disabled
                aria-label="몬스터 명중률 슬라이더"
              />
            </div>
          </div>

          <div class="field user-slider-field">
            <label for="mobAvoid">몬스터 회피율</label>
            <div class="user-number-control">
              <input
                id="mobAvoid"
                class="user-number-input"
                type="text"
                inputmode="numeric"
                autocomplete="off"
                placeholder="ex) 55"
                data-min="1"
                data-max="1000"
              />
              <input
                id="mobAvoidRange"
                class="user-range"
                type="range"
                min="1"
                max="500"
                value="55"
                disabled
                aria-label="몬스터 회피율 슬라이더"
              />
            </div>
          </div>
        </div>
        </article>
      </aside>

      <div class="main-content-column">
    <section id="monsterDetailCard" class="card monster-detail hidden" aria-live="polite">
      <div
        id="monsterManualOverlay"
        class="monster-manual-overlay hidden"
        aria-hidden="true"
      >
        몬스터 정보 수동 입력 됨
      </div>

      <div class="monster-detail-layout">
        <div class="monster-image-wrap">
          <img id="monsterDetailImage" class="monster-image" alt="" />
        </div>

        <div class="monster-detail-content">
          <div class="monster-detail-heading">
            <div>
              <p id="monsterDetailRegion" class="monster-region"></p>
              <div class="monster-name-row">
                <h2 id="monsterDetailName"></h2>
                <span id="monsterBossBadge" class="monster-boss-badge hidden">
                  BOSS
                </span>
                <span id="monsterManualBadge" class="monster-manual-badge hidden">
                  수동 입력
                </span>
              </div>
            </div>
            <span id="monsterDetailLevel" class="monster-level"></span>
          </div>

          <dl class="monster-stat-grid">
            <div><dt>HP</dt><dd id="monsterDetailHp">-</dd></div>
            <div><dt>MP</dt><dd id="monsterDetailMp">-</dd></div>
            <div><dt>EXP</dt><dd id="monsterDetailExp">-</dd></div>
            <div><dt>명중</dt><dd id="monsterDetailAcc">-</dd></div>
            <div><dt>회피</dt><dd id="monsterDetailAvoid">-</dd></div>
            <div><dt>이동속도</dt><dd id="monsterDetailSpeed">-</dd></div>
            <div><dt>물리공격력</dt><dd id="monsterDetailWatt">-</dd></div>
            <div><dt>마법공격력</dt><dd id="monsterDetailMatt">-</dd></div>
            <div><dt>물리방어력</dt><dd id="monsterDetailWdef">-</dd></div>
            <div><dt>마법방어력</dt><dd id="monsterDetailMdef">-</dd></div>
          </dl>
        </div>
      </div>
    </section>

    <section class="card results" aria-live="polite">
      <h2>계산 결과</h2>

      <p id="emptyMessage" class="empty">
        값을 입력하면 계산 가능한 항목이 표시됩니다.
      </p>

      <div id="resultGrid" class="result-grid hidden">
        <div id="requiredAccItem" class="result-item hidden">
          <div class="result-label">100% 타격 필요 명중률</div>
          <div id="requiredAccValue" class="result-value good">-</div>
          <div id="requiredAccPenaltyRate" class="result-sub hidden"></div>
          <div id="requiredAccPenaltyTotal" class="result-sub hidden"></div>
        </div>

        <div id="hitChanceItem" class="result-item hidden">
          <div class="result-label">타격 명중 확률</div>
          <div id="hitChanceValue" class="result-value">-</div>
        </div>

        <div id="physicalMissItem" class="result-item hidden">
          <div class="result-label">피격 시 물리공격 회피 확률</div>
          <div id="physicalSingleResult">
            <div id="physicalMissValue" class="result-value">-</div>
          </div>

          <div id="physicalAvoidChange" class="avoid-change hidden">
            <div id="physicalAvoidPerOne"></div>
            <div id="physicalAvoidPerFive"></div>
            <div id="physicalAvoidPerTen"></div>
          </div>
        </div>

        <div id="magicMissItem" class="result-item hidden">
          <div class="result-label">피격 시 마법공격 회피 확률</div>
          <div id="magicSingleResult">
            <div id="magicMissValue" class="result-value">-</div>
          </div>

          <div id="magicAvoidChange" class="avoid-change hidden">
            <div id="magicAvoidPerOne"></div>
            <div id="magicAvoidPerFive"></div>
            <div id="magicAvoidPerTen"></div>
          </div>
        </div>
      </div>

      <p id="errorMessage" class="error hidden"></p>
    </section>

    <section id="avoidChartCard" class="card chart-card hidden">
      <div class="chart-header">
        <div>
          <h2>회피율 그래프</h2>
          <p id="avoidChartSummary" class="chart-summary"></p>
        </div>
      </div>

      <div class="chart-legend" aria-hidden="true">
        <span class="legend-item legend-physical">
          <span class="legend-line"></span>
          물리공격 회피
        </span>
        <span class="legend-item legend-magic">
          <span class="legend-line"></span>
          마법공격 회피
        </span>
        <span class="legend-item legend-current">
          <span class="legend-line"></span>
          현재 회피율
        </span>
      </div>

      <div class="chart-wrap">
        <canvas id="avoidChart"></canvas>
        <div id="avoidChartHoverLine" class="chart-hover-line hidden"></div>
        <div id="avoidChartTooltip" class="chart-tooltip hidden"></div>
      </div>

    </section>
      </div>
    </div>

  </main>


  <div class="view-mode-controls" aria-label="화면 모드">
    <button
      id="desktopViewButton"
      class="view-mode-button desktop-view-button"
      type="button"
    >
      PC
    </button>

    <button
      id="mobileViewButton"
      class="view-mode-button mobile-view-button"
      type="button"
    >
      MOBILE
    </button>
  </div>

  <script src="mob-preset.js"></script>
  <script src="app.js"></script>

</body>
</html>
