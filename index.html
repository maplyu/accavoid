<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>accavoid lyuhwa</title>

  <link rel="stylesheet" href="styles.css" />

  <style>
    .checkbox-field {
      margin-top: 4px;
    }

    .thief-toggle {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      width: max-content;
      max-width: 100%;
      color: var(--text);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    .thief-toggle-input {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      border: 0;
      white-space: nowrap;
    }

    .thief-toggle-switch {
      position: relative;
      flex: 0 0 auto;
      width: 46px;
      height: 26px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.2);
      transition: background 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }

    .thief-toggle-switch::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      transition: transform 160ms ease;
    }

    .thief-toggle-input:checked + .thief-toggle-switch {
      border-color: var(--accent);
      background: var(--accent);
      box-shadow: 0 0 0 3px rgba(85, 157, 255, 0.14);
    }

    .thief-toggle-input:checked + .thief-toggle-switch::after {
      transform: translateX(20px);
    }

    .thief-toggle-input:focus-visible + .thief-toggle-switch {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .thief-toggle-text {
      min-width: max-content;
      font-size: 0.92rem;
      line-height: 1.2;
      color: var(--text);
    }

    .user-number-control {
      display: grid;
      grid-template-columns: minmax(86px, 116px) minmax(0, 1fr);
      align-items: center;
      gap: 14px;
    }

    .user-number-input {
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .field input.user-range {
      width: 100%;
      height: 24px;
      padding: 0;
      border: 0;
      border-radius: 0;
      outline: none;
      background: transparent;
      box-shadow: none;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .field input.user-range:focus {
      border: 0;
      box-shadow: none;
    }

    .user-range::-webkit-slider-runnable-track {
      height: 6px;
      border-radius: 999px;
      background: rgba(122, 184, 255, 0.24);
    }

    .user-range::-webkit-slider-thumb {
      width: 18px;
      height: 18px;
      margin-top: -6px;
      border: 2px solid var(--panel);
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      -webkit-appearance: none;
      appearance: none;
    }

    .user-range::-moz-range-track {
      height: 6px;
      border: 0;
      border-radius: 999px;
      background: rgba(122, 184, 255, 0.24);
    }

    .user-range::-moz-range-progress {
      height: 6px;
      border-radius: 999px;
      background: var(--accent);
    }

    .user-range::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border: 2px solid var(--panel);
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }

    @media (max-width: 520px) {
      .user-number-control {
        grid-template-columns: 82px minmax(0, 1fr);
        gap: 10px;
      }
    }

  </style>
</head>

<body>
  <main class="page">
    <header class="hero">
      <h1></h1>
    </header>

    <section class="input-grid">
      <article class="card">
        <h2>나의 정보</h2>

        <div class="fields">
          <div class="field user-slider-field">
            <label for="userLevel">나의 레벨</label>
            <div class="user-number-control">
              <input
                id="userLevel"
                class="user-number-input"
                type="text"
                inputmode="numeric"
                autocomplete="off"
                value="180"
                data-min="1"
                data-max="200"
              />
              <input
                id="userLevelRange"
                class="user-range"
                type="range"
                min="1"
                max="200"
                value="180"
                aria-label="나의 레벨 슬라이더"
              />
            </div>
          </div>

          <div class="field user-slider-field">
            <label for="userAcc">나의 명중률</label>
            <div class="user-number-control">
              <input
                id="userAcc"
                class="user-number-input"
                type="text"
                inputmode="numeric"
                autocomplete="off"
                value="180"
                data-min="1"
                data-max="1000"
              />
              <input
                id="userAccRange"
                class="user-range"
                type="range"
                min="1"
                max="1000"
                value="180"
                aria-label="나의 명중률 슬라이더"
              />
            </div>
          </div>

          <div class="field user-slider-field">
            <label for="userAvoid">나의 회피율</label>
            <div class="user-number-control">
              <input
                id="userAvoid"
                class="user-number-input"
                type="text"
                inputmode="numeric"
                autocomplete="off"
                value="100"
                data-min="1"
                data-max="1000"
              />
              <input
                id="userAvoidRange"
                class="user-range"
                type="range"
                min="1"
                max="1000"
                value="100"
                aria-label="나의 회피율 슬라이더"
              />
            </div>
          </div>

          <div class="field checkbox-field">
            <label class="thief-toggle" for="isThiefJob">
              <input
                id="isThiefJob"
                class="thief-toggle-input"
                type="checkbox"
              />
              <span class="thief-toggle-switch" aria-hidden="true"></span>
              <span class="thief-toggle-text">도적 직업군</span>
            </label>
          </div>
        </div>
      </article>

      <article class="card">
        <h2>몬스터 정보</h2>

        <div class="fields">
          <div class="field preset-field">
            <label for="monsterPresetSearch">몬스터 이름 검색</label>
            <div class="preset-search-wrap">
              <input
                id="monsterPresetSearch"
                class="preset-search"
                type="text"
                autocomplete="off"
                placeholder="몬스터 이름 검색"
                aria-autocomplete="list"
                aria-controls="monsterAutocomplete"
                aria-expanded="false"
              />
              <button
                id="monsterPresetClear"
                class="preset-clear hidden"
                type="button"
                aria-label="선택한 몬스터 지우기"
                title="선택한 몬스터 지우기"
              >×</button>
            </div>
            <div
              id="monsterAutocomplete"
              class="autocomplete-list hidden"
              role="listbox"
            ></div>
            <div id="monsterPresetSelected" class="preset-selected hidden"></div>
          </div>

          <div class="field">
            <label for="mobLevel">몬스터 레벨</label>
            <input
              id="mobLevel"
              type="text"
              inputmode="numeric"
              autocomplete="off"
              placeholder="ex) 180"
              data-min="1"
              data-max="200"
            />
          </div>

          <div class="field">
            <label for="mobAcc">몬스터 명중률</label>
            <input
              id="mobAcc"
              type="text"
              inputmode="numeric"
              autocomplete="off"
              placeholder="ex) 270"
              data-min="1"
              data-max="1000"
            />
          </div>

          <div class="field">
            <label for="mobAvoid">몬스터 회피율</label>
            <input
              id="mobAvoid"
              type="text"
              inputmode="numeric"
              autocomplete="off"
              placeholder="ex) 55"
              data-min="1"
              data-max="1000"
            />
          </div>
        </div>
      </article>
    </section>

    <section id="monsterDetailCard" class="card monster-detail hidden" aria-live="polite">
      <div class="monster-detail-layout">
        <div class="monster-image-wrap">
          <img id="monsterDetailImage" class="monster-image" alt="" />
        </div>

        <div class="monster-detail-content">
          <div class="monster-detail-heading">
            <div>
              <p id="monsterDetailRegion" class="monster-region"></p>
              <h2 id="monsterDetailName"></h2>
            </div>
            <span id="monsterDetailLevel" class="monster-level"></span>
          </div>

          <dl class="monster-stat-grid">
            <div><dt>HP</dt><dd id="monsterDetailHp">-</dd></div>
            <div><dt>MP</dt><dd id="monsterDetailMp">-</dd></div>
            <div><dt>EXP</dt><dd id="monsterDetailExp">-</dd></div>
            <div><dt>명중</dt><dd id="monsterDetailAcc">-</dd></div>
            <div><dt>회피</dt><dd id="monsterDetailAvoid">-</dd></div>
            <div><dt>이동속도</dt><dd id="monsterDetailSpeed">-</dd></div>
            <div><dt>물리공격력</dt><dd id="monsterDetailWatt">-</dd></div>
            <div><dt>마법공격력</dt><dd id="monsterDetailMatt">-</dd></div>
            <div><dt>물리방어력</dt><dd id="monsterDetailWdef">-</dd></div>
            <div><dt>마법방어력</dt><dd id="monsterDetailMdef">-</dd></div>
          </dl>
        </div>
      </div>
    </section>

    <div class="actions">
      <button id="resetButton" type="button">입력 초기화</button>
    </div>

    <section class="card results" aria-live="polite">
      <h2>계산 결과</h2>

      <p id="emptyMessage" class="empty">
        값을 입력하면 계산 가능한 항목이 표시됩니다.
      </p>

      <div id="resultGrid" class="result-grid hidden">
        <div id="requiredAccItem" class="result-item hidden">
          <div class="result-label">100% 타격 필요 명중률</div>
          <div id="requiredAccValue" class="result-value good">-</div>
          <div id="requiredAccPenaltyRate" class="result-sub hidden"></div>
          <div id="requiredAccPenaltyTotal" class="result-sub hidden"></div>
        </div>

        <div id="hitChanceItem" class="result-item hidden">
          <div class="result-label">타격 명중 확률</div>
          <div id="hitChanceValue" class="result-value">-</div>
        </div>

        <div id="physicalMissItem" class="result-item hidden">
          <div class="result-label">피격 시 물리공격 회피 확률</div>
          <div id="physicalSingleResult">
            <div id="physicalMissValue" class="result-value">-</div>
          </div>

          <div id="physicalAvoidChange" class="avoid-change hidden">
            <div id="physicalAvoidPerOne"></div>
            <div id="physicalAvoidPerFive"></div>
            <div id="physicalAvoidPerTen"></div>
          </div>
        </div>

        <div id="magicMissItem" class="result-item hidden">
          <div class="result-label">피격 시 마법공격 회피 확률</div>
          <div id="magicSingleResult">
            <div id="magicMissValue" class="result-value">-</div>
          </div>

          <div id="magicAvoidChange" class="avoid-change hidden">
            <div id="magicAvoidPerOne"></div>
            <div id="magicAvoidPerFive"></div>
            <div id="magicAvoidPerTen"></div>
          </div>
        </div>
      </div>

      <p id="errorMessage" class="error hidden"></p>
    </section>

    <section id="avoidChartCard" class="card chart-card hidden">
      <div class="chart-header">
        <div>
          <h2>회피율 그래프</h2>
          <p id="avoidChartSummary" class="chart-summary"></p>
        </div>
      </div>

      <div class="chart-legend" aria-hidden="true">
        <span class="legend-item legend-physical">
          <span class="legend-line"></span>
          물리공격 회피
        </span>
        <span class="legend-item legend-magic">
          <span class="legend-line"></span>
          마법공격 회피
        </span>
        <span class="legend-item legend-current">
          <span class="legend-line"></span>
          현재 회피율
        </span>
      </div>

      <div class="chart-wrap">
        <canvas id="avoidChart"></canvas>
        <div id="avoidChartHoverLine" class="chart-hover-line hidden"></div>
        <div id="avoidChartTooltip" class="chart-tooltip hidden"></div>
      </div>

    </section>

  </main>

  <script src="mob-preset.js"></script>
  <script src="app.js"></script>

  <script>
    (() => {
      "use strict";

      const controls = {
        userLevel: {
          rangeId: "userLevelRange",
          defaultValue: 180
        },
        userAcc: {
          rangeId: "userAccRange",
          defaultValue: 180
        },
        userAvoid: {
          rangeId: "userAvoidRange",
          defaultValue: 100
        }
      };

      function syncRangeFromText(input, range) {
        const value = Number(input.value);

        if (Number.isFinite(value) && input.value !== "") {
          range.value = String(value);
        }
      }

      Object.entries(controls).forEach(
        ([inputId, config]) => {
          const input =
            document.getElementById(inputId);

          const range =
            document.getElementById(config.rangeId);

          if (!input || !range) {
            return;
          }

          range.addEventListener("input", () => {
            input.value = range.value;

            input.dispatchEvent(
              new Event("input", {
                bubbles: true
              })
            );
          });

          input.addEventListener("input", () => {
            syncRangeFromText(input, range);
          });

          input.addEventListener("blur", () => {
            syncRangeFromText(input, range);
          });
        }
      );

      const resetButton =
        document.getElementById("resetButton");

      if (resetButton) {
        resetButton.addEventListener("click", () => {
          Object.entries(controls).forEach(
            ([inputId, config]) => {
              const input =
                document.getElementById(inputId);

              const range =
                document.getElementById(config.rangeId);

              input.value =
                String(config.defaultValue);

              range.value =
                String(config.defaultValue);
            }
          );

          document
            .getElementById("userLevel")
            .dispatchEvent(
              new Event("input", {
                bubbles: true
              })
            );
        });
      }
    })();
  </script>
</body>
</html>
